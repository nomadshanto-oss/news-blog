name: Automated Blogger Post

on:
  workflow_dispatch: # এটি দিয়ে আপনি ম্যানুয়ালি রান করতে পারবেন
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর নিজে থেকেই রান করবে (আপনি চাইলে পরিবর্তন করতে পারেন)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOGGER_ACCESS_TOKEN: ${{ secrets.BLOGGER_ACCESS_TOKEN }}
      run: |
        python main.py
